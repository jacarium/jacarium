# The reviewed VEX decisions: one entry per advisory the scanners report against a release of Jacarium, with the
# status in OpenVEX terms and the reason. scripts/vex.py turns this file into vex/jacarium-<version>.openvex.json
# (validated against vex/openvex_json_schema_0.2.0.json), the OSV-Scanner ignore list (the not_affected ids)
# and what Grype's --vex reads. Nothing is claimed not_affected without a reason verified in the code or the
# deployment - the impact statement says where the vulnerable code is and why it never runs here.
#
# Fields: id (the primary identifier the scanners use), aliases (other ids for the same issue - Grype reports
# Go advisories by their GO-id, Trivy by the CVE, so both are listed), status (not_affected | affected | fixed |
# under_investigation), justification (OpenVEX's list, for not_affected), impact (the verified reason, for
# not_affected), action (what is pending or what the user should do, for affected), notes (for fixed: the
# version that carries the fix), products (image and / or desktop; default image), components (package URLs of
# the affected component inside the product), versions (the releases the decision applies to: exact, '3.4.*',
# '>=3.4.0', '<3.4.0'; default all), decided_by, decided_on. A fixed advisory stays here as "fixed" for the
# releases it was fixed in, so a rescan of an older release's SBOM still reads the right status.
decisions:

  # ---- Caddy's Go toolchain and golang.org/x/net. Up to 3.3.9 the image carried the published Caddy 2.11.7
  # binary (go1.26.8, x/net 0.59.0); Caddy terminates TLS and serves HTTP/1.1 and HTTP/2 on 8443
  # (deploy/Caddyfile), so the server-side denial-of-service issues were reachable by anyone who can reach that
  # port - affected, the self-hosting guide's "LAN / VPN only" limiting who that is. Since 3.4.0 Caddy 2.11.7 is
  # built in deploy/Containerfile on the official golang image with Go 1.27.2 and x/net 0.60.0, which fix every
  # one of them: fixed. Caddy acts as no TLS client here (auto_https off, no ACME, plain-http upstreams on
  # localhost), which is why the one x509 chain-verification issue (fixed only in Go 1.27.3) is not_affected.
  - id: CVE-2026-78669
    aliases: [GO-2026-6611]
    status: affected
    versions: ['<3.4.0']
    components: [pkg:golang/stdlib@1.26.8, pkg:golang/golang.org/x/net@v0.59.0]
    action: >-
      Upgrade to Jacarium 3.4.0 or later, whose Caddy is built with Go 1.27.2 and golang.org/x/net 0.60.0. Until
      then keep port 8443 on your LAN or VPN, as the self-hosting guide says: the issue is excessive CPU use of
      the HTTP/2 server from repeated initial window changes by a client that can reach it.
    decided_by: maintainer
    decided_on: 2026-10-26

  - id: CVE-2026-78667
    aliases: [GO-2026-6609]
    status: affected
    versions: ['<3.4.0']
    components: [pkg:golang/stdlib@1.26.8]
    action: >-
      Upgrade to Jacarium 3.4.0 or later (Caddy built with Go 1.27.2). Denial of service of the HTTP server
      through unbounded Range headers; keep port 8443 on your LAN or VPN until then.
    decided_by: maintainer
    decided_on: 2026-10-26

  - id: CVE-2026-97031
    aliases: [GO-2026-6607]
    status: affected
    versions: ['<3.4.0']
    components: [pkg:golang/stdlib@1.26.8]
    action: >-
      Upgrade to Jacarium 3.4.0 or later (Caddy built with Go 1.27.2). Denial of service of the TLS server through
      malformed ECH outer extension references in a ClientHello; keep port 8443 on your LAN or VPN until then.
    decided_by: maintainer
    decided_on: 2026-10-26

