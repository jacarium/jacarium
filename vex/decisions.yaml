      The base image's npm (nodejs / npm RPMs) and its bundled brace-expansion are removed from the image in
      deploy/Containerfile; /usr/lib/node_modules no longer exists. The application's Node is the Node 24 binary
      from the UI build stage, and its own dependencies come from package-lock.json, which the lock-file scan covers.
    decided_by: maintainer
    decided_on: 2026-10-26
