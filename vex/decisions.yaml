  # build stage. For 3.3.9 and before they were present but unused - nothing in the image ran /usr/bin/node or
  # npm (PATH puts /usr/local/bin first; the entrypoint starts the central server with that node).
  - id: GHSA-6j4f-fj2g-mc7p
    status: not_affected
    justification: component_not_present
    versions: ['>=3.4.0']
    components: [pkg:npm/brace-expansion@2.1.4]
