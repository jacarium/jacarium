  - id: CVE-2026-111943
    aliases: [GO-2026-6809]
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    components: [pkg:golang/stdlib@1.26.8, pkg:golang/stdlib@1.27.2]
    impact: >-
      crypto/x509's chain verification with untrusted intermediates runs when a Go program verifies a peer's
      certificate as a TLS client. Caddy in this image never does: deploy/Caddyfile sets auto_https off (no
      ACME), serves its own certificate from /data/certs, and proxies to plain-http upstreams on localhost
      (reverse_proxy to the Flask backend and the central server); it verifies no certificate. Fixed upstream in
      Go 1.26.10 / 1.27.3, which the Caddy build moves to once those are a week old.
    decided_by: maintainer
    decided_on: 2026-10-26

  # ---- pip's private copies in the image (/opt/app-root/lib/python3.14/site-packages/pip/_vendor, and the
  # system pip under /usr/lib/python3.14): pip vendors urllib3 2.7.0 and msgpack 1.1.2 for its own use. Only pip
  # imports them, and pip runs only while the image is built (deploy/Containerfile's pip install); the running
  # application imports its own urllib3, 2.8.0 from backend/requirements.lock, and no msgpack. The copies move
  # when pip ships newer ones (the Containerfile pins pip and upgrades it at build time).
  - id: CVE-2026-97687
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    components: [pkg:pypi/urllib3@2.7.0]
    impact: >-
      This is pip's vendored urllib3 (pip/_vendor/urllib3, pip 26.2.1's vendor.txt), imported by pip alone; pip
      runs only during the image build. The application and its packages import the urllib3 that
      backend/requirements.lock installs (2.8.0, which has the fix), never pip's copy. The HTTPS-proxy TLS
      override needs an HTTPS proxy configured for a running urllib3, which the image has nowhere.
    decided_by: maintainer
    decided_on: 2026-10-26

  - id: CVE-2026-97689
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    components: [pkg:pypi/urllib3@2.7.0]
    impact: >-
      pip's vendored urllib3 (pip/_vendor), imported by pip alone, which runs only while the image is built; the
      application's urllib3 is 2.8.0 from backend/requirements.lock, where the chunked-encoding fix is in.
    decided_by: maintainer
    decided_on: 2026-10-26

  - id: GHSA-6v7p-g79w-8964
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    components: [pkg:pypi/msgpack@1.1.2]
    impact: >-
      pip's vendored msgpack (pip/_vendor/msgpack), which pip uses for its HTTP cache during an install; pip runs
      only while the image is built. Nothing in backend/requirements.lock depends on msgpack and the application
      never imports it, so no Unpacker is ever reused on untrusted data at runtime.
    decided_by: maintainer
    decided_on: 2026-10-26

  - id: CVE-2025-47273
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    components: [pkg:pypi/setuptools@70.3.0]
    impact: >-
      setuptools' PackageIndex.download is the easy_install-era downloader, run only by setup.py-driven installs
      that fetch distributions by URL. No setuptools module is importable by either interpreter in the image
      (the application's /opt/app-root/bin/python and the system python3.14 both answer ModuleNotFoundError,
      checked in the built image): the scanner's hit is package metadata of the base image's build tooling, not
      an installed package, and the application installs nothing at runtime.
    decided_by: maintainer
    decided_on: 2026-10-26

