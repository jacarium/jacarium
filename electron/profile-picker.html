<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Choose a profile - Jacarium</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280; --border: #d0d7de; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151718; --card: #1f2224; --text: #e6e6e6; --muted: #9aa0a6; --border: #3a3f44; --accent: #3b82f6; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
    main { padding: 20px; max-width: 520px; margin: 0 auto; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
    .brand .wordmark { font-weight: 600; font-size: 18px; letter-spacing: -0.03em; }
    p.sub { color: var(--muted); margin: 0 0 14px; }
    ul { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
    li button { width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 6px; cursor: pointer; font: inherit; }
    li button:hover, li button:focus { border-color: var(--accent); outline: none; }
    li button .name { font-weight: 600; }
    li button .meta { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
    form { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    input[type=text] { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; }
    button.primary { padding: 8px 12px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button.primary:disabled { opacity: .5; cursor: default; }
    label.remember { display: flex; gap: 8px; align-items: center; color: var(--muted); }
    .error { color: #b91c1c; margin: 0 0 10px; min-height: 1.2em; }
    code { background: var(--card); border: 1px solid var(--border); padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 120 120"><path d="M22 110 V54 A38 38 0 0 1 98 54 V110 Z" fill="#7B5CE0"/><g fill="#FFFFFF"><ellipse cx="60" cy="49" rx="8.5" ry="13" transform="rotate(0 60 64)"/><ellipse cx="60" cy="49" rx="8.5" ry="13" transform="rotate(72 60 64)"/><ellipse cx="60" cy="49" rx="8.5" ry="13" transform="rotate(144 60 64)"/><ellipse cx="60" cy="49" rx="8.5" ry="13" transform="rotate(216 60 64)"/><ellipse cx="60" cy="49" rx="8.5" ry="13" transform="rotate(288 60 64)"/></g><circle cx="60" cy="64" r="5" fill="#7B5CE0"/></svg><span class="wordmark">Jacarium</span></div>
    <h1>Choose a profile</h1>
    <p class="sub">Each profile keeps its own documents, tasks, settings and cloud identity.</p>
    <ul id="profiles" data-testid="profile-list"></ul>
    <form id="create">
      <input type="text" id="name" placeholder="new profile name (e.g. work)" autocomplete="off" />
      <button type="submit" class="primary" id="create-button">Create and open</button>
    </form>
    <p class="error" id="error" role="alert"></p>
    <label class="remember"><input type="checkbox" id="remember" /> Always open the chosen profile (File &gt; Switch Profile brings this back)</label>
  </main>
  <script src="./profile-picker.js"></script>
</body>
</html>
