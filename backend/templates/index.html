<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Dashboard - Select Report Type</title>
 <!-- Vendored locally by scripts/vendor-assets.mjs (no CDN) -->
 <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css" />
 <link rel="stylesheet" href="/static/vendor/tailwind.css" />
 <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="text-white font-sans">

<div class="flex justify-center items-center min-h-screen">
 <div class="panel p-8 rounded-lg shadow-xl w-96">
 <div class="flex flex-col items-center justify-center mt-10 mb-8">
 <img src="/static/logo.png" alt="SOSMATE Logo" class="mb-4" width="50%" height="50%">
 <div class="flex items-center space-x-1">
 <h1 class="text-3xl font-bold">SOS</h1>
 <h1 class="text-3xl font-bold text-white">MATE</h1>
 </div>
 </div>
 <form method="POST" action="/" class="space-y-6">
 <div>
 <label for="report_type" class="block text-lg font-medium mb-2">Report</label>
 <div class="relative">
 <select name="report_type" id="report_type"
 class="w-full p-3 pl-10 text-white rounded-md appearance-none focus:outline-hidden focus:ring-2 transition duration-300 ease-in-out">
 <option value="sosreport">sosreport</option>
 <option value="mustgather">mustgather</option>
 </select>
 <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
 <i class="fas fa-file-alt"></i>
 </div>
 <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
 <i class="fas fa-chevron-down"></i>
 </div>
 </div>
 </div>

 <div>
 <label for="directory" class="block text-lg font-medium mb-2">Directory</label>
 <div class="flex items-center text-white rounded-md">
 <i class="fas fa-folder ml-3"></i>
 <input type="text" id="directory" name="directory"
 class="w-full p-3 bg-transparent text-white rounded-md focus:outline-hidden">
 </div>
 </div>

 <div class="flex justify-center">
 <button type="submit"
 class="w-full py-3 px-4 bg-[#0066CC] text-white font-bold rounded-md hover:bg-[#004C99] transition duration-300 ease-in-out shadow-xs">
 <i class="fas fa-check-circle mr-2"></i> Submit
 </button>
 </div>

 <div class="mt-auto text-center text-xs px-2 pb-4">
 <p class="mb-1">Powered by 💖 love</p>
 <p class="mb-1">© 2025 zerodayz</p>
 </div>
 </form>
 </div>
</div>

</body>

</html>
