 <div class="panel rounded-lg shadow-sm">
 <div class="mb-4">
 <input type="text" id="mountFilter" onkeyup="filterMounts()" placeholder="Filter mounts..."
 class="w-full px-3 py-2 text-sm rounded-sm border focus:outline-hidden focus:ring-2">
 </div>
 <div class="overflow-x-auto">
 <table id="mountsTable" class="min-w-full text-sm rounded-lg shadow-md">
 <thead class="border-b">
 <tr>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="sortTable(0)">Filesystem <i id="indicator-0" class="fas text-sm ml-1"></i></th>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="sortTable(1, true)">Size <i id="indicator-1" class="fas text-sm ml-1"></i></th>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="sortTable(2, true)">Used <i id="indicator-2" class="fas text-sm ml-1"></i></th>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="sortTable(3, true)">Available <i id="indicator-3" class="fas text-sm ml-1"></i></th>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="sortTable(4)">Mounted on <i id="indicator-4" class="fas text-sm ml-1"></i></th>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="sortTable(5, false, true)">Use % <i id="indicator-5" class="fas text-sm ml-1"></i></th>
 </tr>
 </thead>
 <tbody>
 {% for entry in data.df.df %}
 <tr class="border-b hover:bg-gray-50">
 <td class="px-4 py-2">{{ entry.filesystem }}</td>
 <td class="px-4 py-2" data-bytes="{{ entry.size }}">{{ entry.size }}</td>
 <td class="px-4 py-2" data-bytes="{{ entry.used }}">{{ entry.used }}</td>
 <td class="px-4 py-2" data-bytes="{{ entry.available }}">{{ entry.available }}</td>
 <td class="px-4 py-2">{{ entry.mounted }}</td>
 <td class="px-4 py-2 w-48">
 {% if entry.used_percent != '-' %}
 <div class="flex items-center space-x-2">
 <div class="flex-1 bg-gray-300 h-4 overflow-hidden rounded-sm">
 <div class="h-4
 {% if entry.used_percent|replace('%','')|int >= 90 %}bg-red-600
 {% elif entry.used_percent|replace('%','')|int >= 70 %}bg-yellow-500
 {% else %}bg-green-600{% endif %}"
 style="width: {{ entry.used_percent }};">
 </div>
 </div>
 <div class="text-xs text-gray-900 whitespace-nowrap font-medium">
 {{ entry.used_percent }}
 </div>
 </div>
 {% else %}
 <div class="text-xs text-right text-gray-900 mt-1">{{ entry.used_percent }}</div>
 {% endif %}
 </td>
 </tr>
 {% endfor %}
 </tbody>
 </table>
 </div>
 </div>
</div>
<script>
 function filterMounts() {
 const input = document.getElementById("mountFilter");
 const filter = input.value.toLowerCase();
 const table = document.getElementById("mountsTable");
 const rows = table.getElementsByTagName("tr");

 for (let i = 1; i < rows.length; i++) {
 const cells = rows[i].getElementsByTagName("td");
 let rowMatches = false;

 for (let j = 0; j < cells.length; j++) {
 const cellText = cells[j].textContent || cells[j].innerText;
 if (cellText.toLowerCase().includes(filter)) {
 rowMatches = true;
 break;
 }
 }

 rows[i].style.display = rowMatches ?"" :"none";
 }
 }

 function formatBytes(kbytes) {
 let bytes = kbytes * 1024;
 if (bytes === 0) return '0 B';
 const k = 1024;
 const sizes = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
 const i = Math.floor(Math.log(bytes) / Math.log(k));
 const value = bytes / Math.pow(k, i);
 return value.toFixed(2) + ' ' + sizes[i];
 }

 document.querySelectorAll('td[data-bytes]').forEach(td => {
 const bytes = parseFloat(td.getAttribute('data-bytes')) || 0;
 td.textContent = formatBytes(bytes);
 });

 var currentSortColumn = currentSortColumn || null;
 var sortDirection = sortDirection || {};

 function sortTable(colIndex, useDataBytes = false, isPercent = false) {
 const table = document.getElementById("mountsTable");
 const tbody = table.querySelector("tbody");
 const rows = Array.from(tbody.querySelectorAll("tr"));
 const key = `${colIndex}-${useDataBytes}-${isPercent}`;

 if (currentSortColumn !== key) {
 currentSortColumn = key;
 sortDirection[key] = true;
 resetIndicators();
 } else {
 sortDirection[key] = !sortDirection[key];
 }

 updateSortIndicator(colIndex, sortDirection[key]);

 rows.sort((a, b) => {
 const cellA = a.children[colIndex];
 const cellB = b.children[colIndex];

 let valA = useDataBytes ? parseFloat(cellA.dataset.bytes || 0) :
 isPercent ? parseFloat(cellA.textContent.replace('%', '').trim()) :
 cellA.textContent.toLowerCase().trim();

 let valB = useDataBytes ? parseFloat(cellB.dataset.bytes || 0) :
 isPercent ? parseFloat(cellB.textContent.replace('%', '').trim()) :
 cellB.textContent.toLowerCase().trim();

 if (isPercent) {
 if (valA === '-' || isNaN(valA)) valA = -1;
 if (valB === '-' || isNaN(valB)) valB = -1;
 }

 if (valA < valB) return sortDirection[key] ? -1 : 1;
 if (valA > valB) return sortDirection[key] ? 1 : -1;
 return 0;
 });

 rows.forEach(row => tbody.appendChild(row));
 }

 function updateSortIndicator(colIndex, ascending) {
 const indicator = document.getElementById(`indicator-${colIndex}`);
 if (ascending) {
 indicator.classList.remove('fa-caret-down');
 indicator.classList.add('fa-caret-up');
 } else {
 indicator.classList.remove('fa-caret-up');
 indicator.classList.add('fa-caret-down');
 }
 }

 function resetIndicators() {
 for (let i = 0; i < 6; i++) {
 const indicator = document.getElementById(`indicator-${i}`);
 if (indicator) {
 indicator.classList.remove('fa-caret-up', 'fa-caret-down');
 }
 }
 }

 window.filterMounts = filterMounts;
 window.sortTable = sortTable;

 sortTable(5, false, true);
 sortTable(5, false, true);
</script>
