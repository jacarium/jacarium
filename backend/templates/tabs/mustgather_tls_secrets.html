<div id="tlsSecretsPanel" class="grid grid-cols-1 gap-4">
 <div class="panel rounded-lg shadow-sm">
 <h3 class="text-lg font-medium mb-2">
 <i class="fas fa-chart-bar mr-2"></i> TLS Certificate Status
 </h3>
 <div>
 {% if data and data|length > 0 %}
 <div style="max-height: 300px; position: relative;">
 <canvas id="tlsStatusChart"></canvas>
 </div>
 {% else %}
 <div class="flex flex-col items-center justify-center py-8 text-center">
 <svg class="shrink-0 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="max-width: 3rem; max-height: 3rem;">
 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
 </svg>
 <div class="text-sm font-medium text-gray-900 mb-1">No TLS Secrets Found</div>
 <div class="text-xs text-gray-500">No secrets with certificate expiry metadata</div>
 </div>
 {% endif %}
 </div>
 </div>

 <div class="panel rounded-lg shadow-sm w-full">
 <h3 class="text-lg font-medium mb-2">
 <i class="fas fa-lock mr-2"></i> TLS Certificate Secrets
 </h3>
 <div class="mb-4 grid grid-cols-1 md:grid-cols-8 gap-2">
 <div>
 <label for="tlsStatusFilter" class="block text-xs font-semibold mb-1">Status</label>
 <select id="tlsStatusFilter" class="w-full px-3 py-2 text-sm border">
 <option value="">All</option>
 <option value="Expired">Expired</option>
 <option value="Expiring Soon">Expiring Soon</option>
 <option value="Valid">Valid</option>
 </select>
 </div>
 <div>
 <label for="tlsNamespaceFilter" class="block text-xs font-semibold mb-1">Namespace</label>
 <select id="tlsNamespaceFilter" class="w-full px-3 py-2 text-sm border">
 <option value="">All</option>
 </select>
 </div>
 <div class="md:col-span-6">
 <label for="tlsSearchInput" class="block text-xs font-semibold mb-1">Search All</label>
 <input id="tlsSearchInput" type="text" placeholder="Search secrets..." class="w-full px-3 py-2 text-sm border"/>
 </div>
 </div>
 <div class="flex justify-between items-center mb-2">
 <div id="filteredTlsCount" class="text-sm">Showing all secrets</div>
 <div class="flex items-center gap-2">
 <label class="text-xs font-semibold">Per Page:</label>
 <select id="tlsPageSizeSelect" onchange="window.changeTlsPageSize()" class="px-3 py-1 text-sm border">
 <option value="50" selected>50</option>
 <option value="100">100</option>
 <option value="250">250</option>
 <option value="-1">All</option>
 </select>
 </div>
 </div>
 <table class="w-full min-w-full text-sm rounded-lg shadow-md">
 <thead class="border-b">
 <tr>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="window.sortTlsBy('status')">Status <i id="tls-indicator-status" class="ml-1 fas text-sm"></i></th>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="window.sortTlsBy('namespace')">Namespace <i id="tls-indicator-namespace" class="ml-1 fas text-sm"></i></th>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="window.sortTlsBy('name')">Name <i id="tls-indicator-name" class="ml-1 fas text-sm"></i></th>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="window.sortTlsBy('expiry')">Expiry Date <i id="tls-indicator-expiry" class="ml-1 fas text-sm"></i></th>
 <th class="px-4 py-2 text-left cursor-pointer" onclick="window.sortTlsBy('days')">Days Left/Ago <i id="tls-indicator-days" class="ml-1 fas text-sm"></i></th>
 </tr>
 </thead>
 <tbody id="tlsTableBody"></tbody>
 </table>
 <div id="tlsPaginationControls" class="flex justify-center items-center gap-2 mt-4"></div>
 </div>
</div>

<div id="tlsDetailsPanel" style="display: none;">
 <div class="space-y-4">
 <div class="mb-4">
 <button onclick="window.backFromTlsModal()" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-gray-300 text-gray-900 text-sm font-medium hover:bg-gray-100 transition-colors">
 Back
 </button>
 </div>

 <div class="panel rounded-lg shadow-sm">
 <h3 class="text-lg font-medium flex items-center mb-2">
 <i class="fas fa-info-circle mr-2"></i> Secret Details
 </h3>
 <div class="overflow-x-auto">
 <table class="min-w-full text-sm" id="tlsDetailsTable"></table>
 </div>
 </div>

 <div class="panel rounded-lg shadow-sm">
 <h3 class="text-lg font-medium flex items-center mb-2">
 <i class="fas fa-tag mr-2"></i> Certificate Annotations
 </h3>
 <div id="tlsAnnotationsTable" class="text-sm"></div>
 </div>

 <div class="panel rounded-lg shadow-sm">
 <h2 class="text-lg font-medium flex items-center mb-2">
 <i class="fas fa-file mr-2"></i> Secret YAML
 </h2>
 <div class="mb-2">
 <input id="tlsYamlFilter" type="text" placeholder="Filter YAML lines..." class="w-full px-3 py-2 text-sm border"/>
 </div>
 <div id="tlsJsonViewer" class="flex-1 overflow-y-auto text-sm font-mono max-h-[60vh] border border-gray-200 dark:border-gray-700 rounded-sm p-3 bg-gray-50 dark:bg-gray-900 break-all"></div>
 </div>
 </div>
</div>


<script>
 var tlsSecretsData = {{ data | tojson }};
 var currentSort = { key: 'days', direction: 1 };
 var tlsCurrentPage = 1;
 var tlsPageSize = 50;
 var currentTlsDetails = null;

 var tlsTableBody = document.getElementById("tlsTableBody");
 var tlsStatusFilter = document.getElementById("tlsStatusFilter");
 var tlsNamespaceFilter = document.getElementById("tlsNamespaceFilter");
 var tlsSearchInput = document.getElementById("tlsSearchInput");
 var tlsPanel = document.getElementById("tlsSecretsPanel");
 var tlsDetailsPanel = document.getElementById("tlsDetailsPanel");

 function formatTimestamp(timestamp) {
 if (!timestamp) return '-';
 try {
 var date = new Date(timestamp);
 return date.toLocaleString('en-US', {
 month: 'short',
 day: '2-digit',
 year: 'numeric',
 hour: '2-digit',
 minute: '2-digit',
 timeZone: 'UTC',
 timeZoneName: 'short'
 });
 } catch(e) {
 return timestamp;
 }
 }

 function populateFilters() {
 var namespaces = new Set();
 tlsSecretsData.forEach(function(secret) {
 if (!secret.error) {
 namespaces.add(secret.namespace);
 }
 });

 tlsNamespaceFilter.innerHTML = '<option value="">All</option>';
 Array.from(namespaces).sort().forEach(function(ns) {
 var option = document.createElement("option");
 option.value = ns;
 option.textContent = ns;
 tlsNamespaceFilter.appendChild(option);
 });
 }

 function getFilteredTls() {
 var selectedStatus = tlsStatusFilter.value;
 var selectedNamespace = tlsNamespaceFilter.value;
 var searchTerm = tlsSearchInput.value.toLowerCase();

 return tlsSecretsData.filter(function(secret) {
 if (secret.error) return false;

 if (selectedStatus && secret.status !== selectedStatus) return false;
 if (selectedNamespace && secret.namespace !== selectedNamespace) return false;

 if (searchTerm) {
 var searchableText = [
 secret.namespace,
 secret.name,
 secret.status,
 secret.type
 ].join(' ').toLowerCase();
 if (!searchableText.includes(searchTerm)) return false;
 }
 return true;
 });
 }

 function renderTlsTable() {
 var filtered = getFilteredTls();

 if (currentSort.key) {
 filtered.sort(function(a, b) {
 var aVal = getSortValue(a, currentSort.key);
 var bVal = getSortValue(b, currentSort.key);

 if (aVal < bVal) return -1 * currentSort.direction;
 if (aVal > bVal) return 1 * currentSort.direction;
 return 0;
 });
 }

 var totalSecrets = filtered.length;
 var startIndex = tlsPageSize === -1 ? 0 : (tlsCurrentPage - 1) * tlsPageSize;
 var endIndex = tlsPageSize === -1 ? totalSecrets : Math.min(startIndex + tlsPageSize, totalSecrets);
 var paginated = filtered.slice(startIndex, endIndex);

 tlsTableBody.innerHTML = "";
 paginated.forEach(function(secret) {
 var row = createTlsRow(secret);
 tlsTableBody.appendChild(row);
 });

 updateFilteredCount(totalSecrets, startIndex, endIndex);
 renderTlsPaginationControls(totalSecrets);
 updateSortIndicators();
 }

 function getSortValue(secret, key) {
 switch(key) {
 case 'status': return secret.status;
 case 'namespace': return secret.namespace;
 case 'name': return secret.name;
 case 'expiry': return secret.expiry_timestamp;
 case 'days': return secret.days_left;
 default: return '';
 }
 }

 function createTlsRow(secret) {
 var row = document.createElement("tr");
 row.className = "cursor-pointer border-b hover:bg-gray-50 dark:hover:bg-gray-800";

 var statusClass = '';
 if (secret.status === 'Expired') {
 statusClass = 'text-red-600 dark:text-red-400 font-semibold';
 } else if (secret.status === 'Expiring Soon') {
 statusClass = 'text-yellow-600 dark:text-yellow-400 font-semibold';
 } else {
 statusClass = 'text-green-600 dark:text-green-400';
 }

 var expiryText = formatTimestamp(secret.expiry);

 row.innerHTML =
 '<td class="px-4 py-2 ' + statusClass + '">' + secret.status + '</td>' +
 '<td class="px-4 py-2">' + secret.namespace + '</td>' +
 '<td class="px-4 py-2">' + secret.name + '</td>' +
 '<td class="px-4 py-2 text-xs">' + expiryText + '</td>' +
 '<td class="px-4 py-2">' + secret.days_display + '</td>';

 row.onclick = function() { showTlsDetails(secret); };
 return row;
 }

 function showTlsDetails(secret) {
 currentTlsDetails = secret;
 tlsPanel.style.display = "none";
 tlsDetailsPanel.style.display = "block";

 var statusClass = '';
 if (secret.status === 'Expired') {
 statusClass = 'text-red-600 dark:text-red-400 font-semibold';
 } else if (secret.status === 'Expiring Soon') {
 statusClass = 'text-yellow-600 dark:text-yellow-400 font-semibold';
 } else {
 statusClass = 'text-green-600 dark:text-green-400';
 }

 var detailsTable = document.getElementById("tlsDetailsTable");
 detailsTable.innerHTML =
 '<tr><td class="font-semibold pr-4 py-1">Name:</td><td>' + secret.name + '</td></tr>' +
 '<tr><td class="font-semibold pr-4 py-1">Namespace:</td><td>' + secret.namespace + '</td></tr>' +
 '<tr><td class="font-semibold pr-4 py-1">Type:</td><td>' + secret.type + '</td></tr>' +
 '<tr><td class="font-semibold pr-4 py-1">Status:</td><td class="' + statusClass + '">' + secret.status + '</td></tr>' +
 '<tr><td class="font-semibold pr-4 py-1">Expiry Date:</td><td>' + formatTimestamp(secret.expiry) + '</td></tr>' +
 '<tr><td class="font-semibold pr-4 py-1">Days Left/Ago:</td><td>' + secret.days_display + '</td></tr>' +
 '<tr><td class="font-semibold pr-4 py-1">Created:</td><td>' + formatTimestamp(secret.created) + '</td></tr>';

 // Annotations
 var annotationsDiv = document.getElementById("tlsAnnotationsTable");
 if (secret.annotations && Object.keys(secret.annotations).length > 0) {
 var annotationsHtml = '<div class="space-y-2">';
 for (var key in secret.annotations) {
 if (key.startsWith('auth.openshift.io/certificate-')) {
 annotationsHtml += '<div><span class="font-semibold text-xs">' + key + ':</span><div class="text-xs mt-1 p-2 bg-gray-50 dark:bg-gray-800 rounded-sm break-all">' + secret.annotations[key] + '</div></div>';
 }
 }
 annotationsHtml += '</div>';
 annotationsDiv.innerHTML = annotationsHtml;
 } else {
 annotationsDiv.innerHTML = '<div class="text-gray-500">No certificate annotations</div>';
 }

 // YAML viewer
 renderTlsYaml();
 }

 function highlightJSON(line) {
 line = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
 return line
 .replace(/"([^"]+)":/g, '<span class="text-blue-700 dark:text-blue-300">"$1"</span>:')
 .replace(/:\s*"([^"]*)"/g, ': <span class="text-green-700 dark:text-green-300">"$1"</span>')
 .replace(/:\s*(true|false)/g, ': <span class="text-blue-600 dark:text-blue-400">$1</span>')
 .replace(/:\s*(null)/g, ': <span class="text-gray-500 dark:text-gray-400">$1</span>')
 .replace(/:\s*(-?\d+\.?\d*)/g, ': <span class="text-orange-600 dark:text-orange-400">$1</span>');
 }

 function renderJSONWithoutHighlight(data, filter) {
 var formatted = JSON.stringify(data, null, 2);
 return formatted.split('\n')
 .filter(function(line) {
 return !filter || line.toLowerCase().includes(filter.toLowerCase());
 })
 .map(function(line) {
 var highlighted = highlightJSON(line);
 return '<div class="text-gray-900 dark:text-gray-100 text-sm font-mono whitespace-pre-wrap break-all">' + highlighted + '</div>';
 }).join('');
 }

 function renderTlsYaml() {
 var viewer = document.getElementById("tlsJsonViewer");
 var filter = document.getElementById("tlsYamlFilter");

 function updateYaml() {
 var filterText = filter.value;
 viewer.innerHTML = renderJSONWithoutHighlight(currentTlsDetails.raw, filterText);
 }

 filter.oninput = updateYaml;
 updateYaml();
 }

 window.backFromTlsModal = function() {
 tlsDetailsPanel.style.display = "none";
 tlsPanel.style.display = "block";
 };

 function updateFilteredCount(total, start, end) {
 var countDiv = document.getElementById("filteredTlsCount");
 if (tlsPageSize === -1) {
 countDiv.textContent = "Showing all " + total + " secret(s)";
 } else {
 countDiv.textContent = "Showing " + (start + 1) + "-" + end + " of " + total + " secret(s)";
 }
 }

 function renderTlsPaginationControls(totalSecrets) {
 var controls = document.getElementById("tlsPaginationControls");
 if (tlsPageSize === -1) {
 controls.innerHTML = "";
 return;
 }

 var totalPages = Math.ceil(totalSecrets / tlsPageSize);
 var html = "";

 if (tlsCurrentPage > 1) {
 html += '<button onclick="window.changeTlsPage(' + (tlsCurrentPage - 1) + ')" class="px-3 py-1 border rounded-sm hover:bg-gray-100 dark:hover:bg-gray-700">Previous</button>';
 }

 var startPage = Math.max(1, tlsCurrentPage - 2);
 var endPage = Math.min(totalPages, tlsCurrentPage + 2);

 for (var i = startPage; i <= endPage; i++) {
 var activeClass = i === tlsCurrentPage ? "bg-blue-500 text-white current-page" : "border hover:bg-gray-100 dark:hover:bg-gray-700";
 html += '<button onclick="window.changeTlsPage(' + i + ')" class="px-3 py-1 rounded-sm ' + activeClass + '">' + i + '</button>';
 }

 if (tlsCurrentPage < totalPages) {
 html += '<button onclick="window.changeTlsPage(' + (tlsCurrentPage + 1) + ')" class="px-3 py-1 border rounded-sm hover:bg-gray-100 dark:hover:bg-gray-700">Next</button>';
 }

 controls.innerHTML = html;
 }

 window.changeTlsPage = function(page) {
 tlsCurrentPage = page;
 renderTlsTable();
 };

 window.changeTlsPageSize = function() {
 var select = document.getElementById("tlsPageSizeSelect");
 tlsPageSize = parseInt(select.value);
 tlsCurrentPage = 1;
 renderTlsTable();
 };

 window.sortTlsBy = function(key) {
 if (currentSort.key === key) {
 currentSort.direction *= -1;
 } else {
 currentSort.key = key;
 currentSort.direction = 1;
 }
 renderTlsTable();
 };

 function updateSortIndicators() {
 ["status", "namespace", "name", "expiry", "days"].forEach(function(key) {
 var indicator = document.getElementById("tls-indicator-" + key);
 if (currentSort.key === key) {
 indicator.className = "ml-1 fas " + (currentSort.direction === 1 ? "fa-sort-up" : "fa-sort-down");
 } else {
 indicator.className = "ml-1 fas";
 }
 });
 }

 // Event listeners
 tlsStatusFilter.addEventListener("change", function() {
 tlsCurrentPage = 1;
 renderTlsTable();
 });

 tlsNamespaceFilter.addEventListener("change", function() {
 tlsCurrentPage = 1;
 renderTlsTable();
 });

 tlsSearchInput.addEventListener("input", function() {
 tlsCurrentPage = 1;
 renderTlsTable();
 });

 // Status chart
 function renderStatusChart() {
 if (!tlsSecretsData || tlsSecretsData.length === 0) {
 return;
 }

 var expiredCount = 0;
 var expiringSoonCount = 0;
 var validCount = 0;

 tlsSecretsData.forEach(function(secret) {
 if (secret.error) return;
 if (secret.status === 'Expired') {
 expiredCount++;
 } else if (secret.status === 'Expiring Soon') {
 expiringSoonCount++;
 } else if (secret.status === 'Valid') {
 validCount++;
 }
 });

 var labels = [];
 var data = [];
 var colors = [];

 if (expiredCount > 0) {
 labels.push('Expired');
 data.push(expiredCount);
 colors.push('rgb(239, 68, 68)');
 }
 if (expiringSoonCount > 0) {
 labels.push('Expiring Soon');
 data.push(expiringSoonCount);
 colors.push('rgb(245, 158, 11)');
 }
 if (validCount > 0) {
 labels.push('Valid');
 data.push(validCount);
 colors.push('rgb(34, 197, 94)');
 }

 if (labels.length === 0) return;

 var ctx = document.getElementById('tlsStatusChart');
 new Chart(ctx, {
 type: 'bar',
 data: {
 labels: labels,
 datasets: [{
 label: 'TLS Secrets',
 data: data,
 backgroundColor: colors
 }]
 },
 options: {
 responsive: true,
 maintainAspectRatio: false,
 scales: {
 x: {
 ticks: { color: diagnosticsThemeColor('text') },
 grid: { color: diagnosticsThemeColor('grid') }
 },
 y: {
 beginAtZero: true,
 ticks: {
 stepSize: 1,
 color: diagnosticsThemeColor('text')
 },
 grid: { color: diagnosticsThemeColor('grid') }
 }
 },
 plugins: {
 legend: {
 display: false
 }
 }
 }
 });
 }

 // Initialize
 populateFilters();
 renderTlsTable();
 renderStatusChart();

</script>
