{% import "tabs/_ui.html" as ui %}
{% import "tabs/_detail.html" as detail %}
{{ ui.findings(findings) }}
<div id="nodePanel" class="grid grid-cols-1 gap-4">
 <div class="panel rounded-lg shadow-sm w-full">
 {% call ui.filter_bar() %}<label class="ui-field">{{ ui.icon('search') }}<input id="nodeSearchInput" type="search" data-ui-search placeholder="Search nodes" aria-label="Search nodes" autocomplete="off" class="ui-input"></label>{% endcall %}
 <div class="ui-pagebar"><span class="ui-status" id="filteredNodeCount" aria-live="polite">Showing all nodes</span><div class="ui-pagebar-right"><label class="ui-rows">Rows per page<span class="ui-select-wrap ui-narrow"><select aria-label="Rows per page" id="nodePageSizeSelect" onchange="window.diagBusy ? window.diagBusy.filter(this, function () { window.changeNodePageSize(); }) : window.changeNodePageSize()" class="ui-select">
 <option value="25">25</option>
 <option value="50" selected>50</option>
 <option value="100">100</option>
 <option value="-1">All</option>
 </select>{{ ui.icon('chevron') }}</span></label></div></div>
 <table class="ui-table">
 <thead>
 <tr>
 <th class="cursor-pointer" data-w="flex" onclick="window.sortNodesBy('name')">
 Name <i id="node-indicator-name" class="ml-1 fas text-sm"></i>
 </th>
 <th class="cursor-pointer" data-w="narrow" data-p="3" onclick="window.sortNodesBy('ip')">
 IP <i id="node-indicator-ip" class="ml-1 fas text-sm"></i>
 </th>
 <th class="cursor-pointer" data-w="num" onclick="window.sortNodesBy('cpu')">
 CPU <i id="node-indicator-cpu" class="ml-1 fas text-sm"></i>
 </th>
 <th class="cursor-pointer" data-w="num" onclick="window.sortNodesBy('memory')">
 Memory <i id="node-indicator-memory" class="ml-1 fas text-sm"></i>
 </th>
 <th class="cursor-pointer" data-w="narrow" data-p="2" onclick="window.sortNodesBy('kubelet')">
 Kubelet <i id="node-indicator-kubelet" class="ml-1 fas text-sm"></i>
 </th>
 <th class="cursor-pointer" data-w="text" data-p="3" onclick="window.sortNodesBy('osImage')">
 OS Image <i id="node-indicator-osImage" class="ml-1 fas text-sm"></i>
 </th>
 <th class="cursor-pointer" data-w="narrow" data-p="3" onclick="window.sortNodesBy('arch')">
 Arch <i id="node-indicator-arch" class="ml-1 fas text-sm"></i>
 </th>
 <th class="cursor-pointer" data-w="status" onclick="window.sortNodesBy('ready')">
 Ready <i id="node-indicator-ready" class="ml-1 fas text-sm"></i>
 </th>
 <th class="cursor-pointer" data-w="status" data-p="2" onclick="window.sortNodesBy('schedulable')">
 Schedule <i id="node-indicator-schedulable" class="ml-1 fas text-sm"></i>
 </tr>
 </thead>
 <tbody id="nodeTableBody"></tbody>
 </table>
 <nav id="nodePaginationControls" class="ui-pager" aria-label="Pages" hidden></nav>
 </div>
</div>

{{ ui.detail_page('nodeDetail') }}

{{ detail.k8s_detail_script() }}
<script>
 var nodeData = {{ data | tojson }};

 var flattenedNodes = [];
 var currentSort = { key:"name", direction: 1 };
 var nodeCurrentPage = 1;
 var nodePageSize = 50;

 var nodeTableBody = document.getElementById("nodeTableBody");
 var filteredNodeCount = document.getElementById("filteredNodeCount");
 var nodeSearchInput = document.getElementById("nodeSearchInput");

 var nodePanel = document.getElementById("nodePanel");
 var nodeDetailView = document.getElementById("nodeDetail");
 var byKey = {};   // node name -> the parsed node, for the detail

 function flattenNodes() {
 flattenedNodes = [];

 Object.entries(nodeData).forEach(([nodeName, node]) => {
 flattenedNodes.push({
 name: node.metadata?.name || nodeName,
 ip: getNodeInternalIP(node) ||"-",
 hostname: node.status?.nodeInfo?.machineID ||"-",
 cpu: node.status?.capacity?.cpu ||"-",
 memory: node.status?.capacity?.memory ||"-",
 kubelet: node.status?.nodeInfo?.kubeletVersion ||"-",
 osImage: node.status?.nodeInfo?.osImage ||"-",
 arch: node.status?.nodeInfo?.architecture ||"-",
 ready: getNodeReadyStatus(node),
 schedulable: node.spec?.unschedulable ?"No" :"Yes",
 raw: node,
 });
 });
 }

 function getNodeInternalIP(node) {
 if (node.status?.addresses) {
 const ipAddr = node.status.addresses.find(addr => addr.type ==="InternalIP");
 return ipAddr ? ipAddr.address :"-";
 }
 return"-";
 }

 function getNodeReadyStatus(node) {
 if (!node.status?.conditions) return"-";
 const readyCond = node.status.conditions.find(c => c.type ==="Ready");
 if (!readyCond) return"-";
 return readyCond.status ||"-";
 }

 function renderNodeTable(nodes) {
 nodeTableBody.innerHTML ="";
 if (nodes.length === 0) {
 filteredNodeCount.textContent ="No nodes found.";
 nodeTableBody.innerHTML = `<tr><td colspan="9" class="text-center">No matching nodes found</td></tr>`;
 updateNodePagination(0);
 return;
 }

 const totalCount = nodes.length;
 const start = nodePageSize === -1 ? 0 : (nodeCurrentPage - 1) * nodePageSize;
 const end = nodePageSize === -1 ? totalCount : Math.min(start + nodePageSize, totalCount);
 const paginatedNodes = nodePageSize === -1 ? nodes : nodes.slice(start, end);

 const countText = nodePageSize === -1
 ? `Showing all ${totalCount} node${totalCount !== 1 ?"s" :""}`
 : `Showing ${start + 1}-${end} of ${totalCount} node${totalCount !== 1 ?"s" :""}`;
 filteredNodeCount.textContent = countText;

 paginatedNodes.forEach((n) => {
 const tr = document.createElement("tr");
 tr.className = "cursor-pointer border-b hover:bg-gray-50 dark:hover:bg-gray-800";
 tr.setAttribute('data-detail', n.name);
 tr.tabIndex = 0;
 byKey[n.name] = n;
 tr.innerHTML = `
 <td>${n.name}</td>
 <td>${n.ip}</td>
 <td>${n.cpu}</td>
 <td>${n.memory}</td>
 <td>${n.kubelet}</td>
 <td>${n.osImage}</td>
 <td>${n.arch}</td>
 <td>${n.ready}</td>
 <td>${n.schedulable}</td>
 `;
 nodeTableBody.appendChild(tr);
 });

 updateNodePagination(totalCount);
 }

 function updateNodePagination(totalCount) {
   // the shared pager (diagPager): one page -> nothing drawn
   window.diagPager.render(document.getElementById('nodePaginationControls'), { total: totalCount, page: nodeCurrentPage, pageSize: nodePageSize, go: function (p) { window.goToNodePage(p); } });
 }

 window.goToNodePage = function(page) {
 nodeCurrentPage = page;
 filterAndSortNodes();
 }

 window.changeNodePageSize = function() {
 const select = document.getElementById("nodePageSizeSelect");
 nodePageSize = parseInt(select.value);
 nodeCurrentPage = 1;
 filterAndSortNodes();
 }

 window.sortNodesBy = function(key) {
 if (currentSort.key === key) {
 currentSort.direction *= -1;
 } else {
 currentSort.key = key;
 currentSort.direction = 1;
 }
 nodeCurrentPage = 1;
 sortAndFilterNodes();
 updateSortIndicators();
 }

 function updateSortIndicators() {
 const keys = ["name","ip","cpu","memory","kubelet","osImage","arch","ready","schedulable"];
 keys.forEach(k => {
 const el = document.getElementById("node-indicator-" + k);
 if (!el) return;
 el.className ="ml-1 fas text-sm" + (k === currentSort.key ? (currentSort.direction > 0 ?" fa-sort-up" :" fa-sort-down") :"");
 if (k === currentSort.key) window.diagTables.markSort(el, currentSort.direction > 0);
 });
 }

 function sortAndFilterNodes() {
 const searchTerm = nodeSearchInput.value.toLowerCase();

 let filtered = flattenedNodes.filter(n => {
 if (!searchTerm) return true;
 const combined = [n.name, n.ip, n.cpu, n.memory, n.kubelet, n.osImage, n.arch, n.ready, n.schedulable].join("").toLowerCase();
 return combined.includes(searchTerm);
 });

 filtered.sort((a, b) => {
 let valA = a[currentSort.key] ||"";
 let valB = b[currentSort.key] ||"";

 if (["cpu","memory"].includes(currentSort.key)) {
 valA = parseCpuMemValue(valA);
 valB = parseCpuMemValue(valB);
 return (valA - valB) * currentSort.direction;
 }

 return valA.localeCompare(valB) * currentSort.direction;
 });

 renderNodeTable(filtered);
 }

 function parseCpuMemValue(val) {
 if (!val || val ==="-") return 0;
 if (val.endsWith("m")) return parseInt(val.slice(0, -1)) / 1000;
 if (val.toLowerCase().endsWith("mi")) return parseInt(val) * 1024 * 1024;
 if (val.toLowerCase().endsWith("gi")) return parseInt(val) * 1024 * 1024 * 1024;
 const f = parseFloat(val);
 return isNaN(f) ? 0 : f;
 }

 // ============================================================================
 // THE DETAIL (the shared diagDetail component; the data is the parser's _detail record)
 // ============================================================================

 const D = window.diagDetail, K = window.k8sDetail;
 const METER_LABEL = { cpu: 'CPU', memory: 'Memory', pods: 'Pods', 'ephemeral-storage': 'Ephemeral storage' };
 function renderNodeDetail(key, view) {
 const n = byKey[key];
 if (!n || !n.raw) return false;
 const raw = n.raw, d = raw._detail || {}, s = d.summary || {};
 D.header(view, {
 title: n.name, crumbs: ['Nodes', n.name],
 badge: d.badge || { kind: n.ready === 'True' ? 'ok' : 'bad', text: n.ready === 'True' ? 'Ready' : 'NotReady' },
 actions: [
 { label: 'Copy name', copy: n.name },
 { label: 'Copy JSON', copy: window.diagCode.text(raw) },
 { label: 'Open pods', tab: 'workloads', subTab: 'pod', query: n.name, title: 'The Pods page, searched for this node' },
 // the node's journals and its role's host service logs (host_service_logs/masters or workers)
 { label: 'Open node logs', tab: 'log_collection', subTab: 'log_viewer', query: 'sources=node:' + n.name + [...new Set((s.roles || ['worker']).map((r) => /master|control-plane/.test(r) ? 'masters' : r + 's'))].map((d) => ',host:' + d).join(''), title: 'The Log Viewer with this node\'s journals and its role\'s host service logs' },
 ],
 });
 D.findings(view, d.findings || []);
 const body = D.body(view);
 const addr = (t) => ((s.addresses || []).find((a) => a.type === t) || {}).address || '';
 body.appendChild(D.section('Summary', D.kv([
 ['Roles', (s.roles || []).join(', ')], ['Internal IP', addr('InternalIP'), 'mono'], ['External IP', addr('ExternalIP'), 'mono'], ['Hostname', addr('Hostname')],
 ['Kubelet', s.kubelet], ['Runtime', s.runtime], ['OS', s.os], ['Kernel', s.kernel], ['Arch', s.arch],
 ['Created', s.created ? D.when(s.created) + (s.age ? ' (' + s.age + ' before the gather)' : '') : ''],
 ['Schedulable', s.cordoned ? 'no (cordoned)' : 'yes'], ['Pod CIDR', s.pod_cidr, 'mono'], ['Provider ID', s.provider_id, 'mono'],
 ['Machine', s.machine], ['MachineConfig', s.current_config ? s.current_config + (s.desired_config && s.desired_config !== s.current_config ? ' → ' + s.desired_config : '') + (s.mc_state ? ' (' + s.mc_state + ')' : '') : ''],
 ['Images', d.images ? d.images + ' on the node' : ''], ['Volumes in use', d.volumes_in_use || ''],
 ['Labels', K.labels(s.labels)], ['Annotations', s.annotations ? s.annotations + ' (in the JSON below)' : ''],
 ]), { open: true }));
 // Capacity vs allocatable: one meter per resource
 const meters = d.meters || [];
 body.appendChild(D.section('Capacity', meters.length ? D.table([{ text: 'Resource', w: 'narrow' }, { text: 'Capacity', w: 'num' }, { text: 'Allocatable', w: 'num' }, { text: 'Allocatable share', w: 'wide' }], meters.map((m) => {
 const role = m.share === null ? 'muted' : (m.share < 50 ? 'warn' : 'ok');
 return [METER_LABEL[m.resource] || m.resource, m.capacity, m.allocatable, m.capacity_raw ? D.meter(m.allocatable_raw || 0, m.capacity_raw, role, (m.share === null ? '' : m.share + '%'), 'the allocatable part of the capacity (the rest is reserved for the system and the kubelet)') : ''];
 })) : 'No capacity recorded in status.', { open: true }));
 body.appendChild(D.section('Conditions', K.conditions(d.conditions), { open: true, count: (d.conditions || []).length }));
 const taints = d.taints || [];
 body.appendChild(D.section('Taints', taints.length ? D.list(taints) : 'No taints: every pod may schedule here.', { count: taints.length }));
 // the pods on this node (from every pod manifest in the gather)
 const pods = d.pods || { count: 0, rows: [], phases: {} };
 const podsWrap = D.el('div', 'ui-detail-stack');
 if (pods.count) {
 const chips = D.el('span', 'ui-detail-chips'); Object.keys(pods.phases).sort().forEach((ph) => { chips.appendChild(D.chip(ph + ' ' + pods.phases[ph])); }); podsWrap.appendChild(chips);
 podsWrap.appendChild(D.table([{ text: 'Namespace', w: 'narrow' }, { text: 'Pod', w: 'wrap' }, { text: 'Phase', w: 'status' }], pods.rows.map((p) => [p.namespace, D.link(p.name, 'workloads', 'pod', 'detail=' + p.namespace + '/' + p.name, 'Open the pod'), D.badge(p.phase === 'Running' ? 'ok' : (p.phase === 'Succeeded' ? 'muted' : (p.phase === 'Pending' ? 'warn' : 'bad')), p.phase || '?')])));
 if (pods.count > pods.rows.length) podsWrap.appendChild(D.el('p', 'ui-muted', (pods.count - pods.rows.length) + ' more not listed.'));
 } else podsWrap.appendChild(D.el('p', 'ui-muted', 'No pod manifest in the gather names this node.'));
 podsWrap.appendChild(D.link('Open the Pods page for ' + n.name, 'workloads', 'pod', n.name));
 body.appendChild(D.section('Pods on this node', podsWrap, { open: true, count: pods.count }));
 body.appendChild(D.section('Field ownership', K.ownership(d.ownership), { count: d.ownership ? d.ownership.total : 0 }));
 body.appendChild(K.code(raw, 'Node'));
 return true;
 }
 D.register(nodePanel, nodeDetailView, { rows: 'tbody tr[data-detail]', render: renderNodeDetail });
 window.showNodeDetails = function (node) { D.open(node.name); };
 window.backFromNodeModal = function () { D.back(); };

 nodeSearchInput.addEventListener("input", () => {
 nodeCurrentPage = 1;
 sortAndFilterNodes();
 });

 flattenNodes();
 sortAndFilterNodes();
 updateSortIndicators();
</script>
