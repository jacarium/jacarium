{% import "tabs/_ui.html" as ui %}
{{ ui.findings(findings) }}
<div id="eventPanel" class="grid grid-cols-1 gap-4">
 <div class="panel rounded-lg shadow-sm">
 <h3 class="text-lg font-medium mb-2">
 <i class="fas fa-chart-bar mr-2"></i> Event Types
 </h3>
 <div>
 {% if data %}
 <canvas id="reasonChart"></canvas>
 {% else %}
 {% endif %}
 </div>
 </div>
 <div class="panel rounded-lg shadow-sm">
 <h3 class="text-lg font-medium mb-2">
 <i class="fas fa-bell mr-2"></i> Events
 </h3>
 {% call ui.filter_bar() %}
    <label class="ui-field">{{ ui.icon('search') }}<input autocomplete="off" data-ui-search aria-label="Search events" id="eventSearchInput" type="search" placeholder="Search events..."
 class="ui-input"></label>
    <label class="ui-rows">Namespaces<span class="ui-select-wrap"><select aria-label="Namespaces" id="eventNamespaceFilter"
 class="ui-select">
 <option value="">All</option>
 </select>{{ ui.icon('chevron') }}</span></label>
    <label class="ui-rows">Reason<span class="ui-select-wrap"><select aria-label="Reason" id="eventReasonFilter"
 class="ui-select">
 <option value="">All</option>
 </select>{{ ui.icon('chevron') }}</span></label>
    <label class="ui-check-label" for="show-empty-namespaces"><input type="checkbox" id="show-empty-namespaces" class="ui-check">Show Empty Namespaces</label>
    {% call ui.end() %}<span class="ui-status" id="filteredEventCount" aria-live="polite">Showing all events</span><label class="ui-rows">Rows per page<span class="ui-select-wrap ui-narrow"><select aria-label="Rows per page" id="eventPageSizeSelect" onchange="window.diagBusy ? window.diagBusy.filter(this, function () { window.changeEventPageSize(); }) : window.changeEventPageSize()" class="ui-select">
 <option value="50">50</option>
 <option value="100" selected>100</option>
 <option value="250">250</option>
 <option value="500">500</option>
 <option value="-1">All</option>
 </select>{{ ui.icon('chevron') }}</span></label>{% endcall %}
  {% endcall %}
 <table class="ui-table">
 <thead>
 <tr>
 <th class="cursor-pointer" onclick="window.sortEventsBy('namespace')">Namespace <i id="event-indicator-namespace" class="ml-1 fas text-sm"></i></th>
 <th class="cursor-pointer" onclick="window.sortEventsBy('lastSeen')">Last Seen <i id="event-indicator-lastSeen" class="ml-1 fas text-sm"></i></th>
 <th class="cursor-pointer" onclick="window.sortEventsBy('type')">Type <i id="event-indicator-type" class="ml-1 fas text-sm"></i></th>
 <th class="cursor-pointer" onclick="window.sortEventsBy('reason')">Reason <i id="event-indicator-reason" class="ml-1 fas text-sm"></i></th>
 <th class="cursor-pointer" onclick="window.sortEventsBy('object')">Object <i id="event-indicator-object" class="ml-1 fas text-sm"></i></th>
 <th class="cursor-pointer" onclick="window.sortEventsBy('message')">Message <i id="event-indicator-message" class="ml-1 fas text-sm"></i></th>
 </tr>
 </thead>
 <tbody id="eventTableBody"></tbody>
 </table>
 <nav id="eventPaginationControls" class="ui-pager" aria-label="Pages" hidden></nav>
 </div>
</div>

<div id="eventDetailsPanel" style="display: none;">
 <div class="space-y-4">
 <div class="mb-4">
 <button onclick="window.backFromEventModal()" class="btn btn-secondary flex items-center gap-2">
 Back
 </button>
 </div>

 <div class="panel rounded-lg shadow-sm">
 <h3 class="text-lg font-medium flex items-center mb-2">
 <i class="fas fa-info-circle mr-2"></i> Event Details
 </h3>
 <div class="overflow-x-auto">
 <table class="ui-table" id="eventDetailsTable"></table>
 </div>
 </div>

 <div class="panel rounded-lg shadow-sm">
 <h2 class="text-lg font-medium flex items-center mb-2">
 <i class="fas fa-file mr-2"></i> Event YAML
 </h2>
 <div class="mb-2">
 <input
 id="eventYamlFilter"
 type="text"
 placeholder="Filter YAML lines..."
 class="ui-input w-full"
 />
 </div>
 <div id="eventJsonViewer" class="flex-1 overflow-y-auto text-sm font-mono max-h-[60vh] border border-gray-200 dark:border-gray-700 rounded-sm p-3 bg-gray-50 dark:bg-gray-900 break-all"></div>
 </div>
 </div>
</div>

<script>
 var eventsData = {{ data | tojson }};

 var flattenedEvents = [];
 var currentSort = { key:"lastSeen", direction: 1 };
 var eventCurrentPage = 1;
 var eventPageSize = 100;

 var eventPanel = document.getElementById("eventPanel");
 var eventJsonViewer = document.getElementById("eventJsonViewer");
 var eventDetailsTable = document.getElementById("eventDetailsTable");
 var eventNamespaceFilter = document.getElementById("eventNamespaceFilter");
 var eventSearchInput = document.getElementById("eventSearchInput");
 var currentEvent = null;
 var lastClickedRow = null;

 var showEmptyNamespacesCheckbox = document.getElementById("show-empty-namespaces");

 function parseLastSeen(timestamp) {
 return timestamp ? new Date(timestamp) : null;
 }

 function flattenEvents(showEmptyNamespaces) {
 flattenedEvents = [];

 Object.entries(eventsData).forEach(([namespace, evs]) => {
 if (!showEmptyNamespaces && (!evs || evs.length === 0)) {
 return;
 }

 if (!evs || evs.length === 0) {
 flattenedEvents.push({
 namespace,
 name:"-",
 lastSeen:"-",
 type:"-",
 reason:"-",
 object:"No Events",
 message:"-",
 isPlaceholder: true,
 raw: {},
 });
 } else {
 evs.forEach((ev) => {
 flattenedEvents.push({
 namespace,
 name: ev.metadata?.name ||"",
 lastSeen: ev.metadata.creationTimestamp ||"-",
 type: ev.type ||"",
 reason: ev.reason ||"",
 object: ev.involvedObject?.name ||"",
 message: ev.message ||"",
 raw: ev,
 isPlaceholder: false,
 });
 });
 }
 });

 populateNamespaceFilter();
 populateReasonFilter();
 sortAndFilterEvents();
 }

 function populateNamespaceFilter() {
 eventNamespaceFilter.innerHTML = `<option value="">All</option>`;

 const namespaces = Array.from(new Set(flattenedEvents.map((ev) => ev.namespace)));

 namespaces.forEach((ns) => {
 eventNamespaceFilter.innerHTML += `<option value="${ns}">${ns}</option>`;
 });
 }

 function populateReasonFilter() {
 const reasonFilter = document.getElementById("eventReasonFilter");
 reasonFilter.innerHTML = `<option value="">All</option>`;

 const reasons = Array.from(new Set(flattenedEvents.map(ev => ev.reason).filter(Boolean))).sort();
 reasons.forEach(reason => {
 reasonFilter.innerHTML += `<option value="${reason}">${reason}</option>`;
 });
 }

 window.sortEventsBy = function(key) {
 if (currentSort.key === key) {
 currentSort.direction = -currentSort.direction;
 } else {
 currentSort.key = key;
 currentSort.direction = 1;
 }
 eventCurrentPage = 1;
 sortAndFilterEvents();
 updateSortIndicators();
 }

 function updateSortIndicators() {
 const baseClass ="ml-1 fas text-sm";

 ["namespace","lastSeen","type","reason","object","message"].forEach((k) => {
 const el = document.getElementById("event-indicator-" + k);

 if (k === currentSort.key) {
  window.diagTables.markSort(el, currentSort.direction > 0);
 el.className = `${baseClass} ${currentSort.direction > 0 ?"fa-sort-up" :"fa-sort-down"}`;
 } else {
 el.className = `${baseClass}`;
 }
 });
 }


 function sortAndFilterEvents() {
 const namespaceFilter = eventNamespaceFilter.value.toLowerCase();
 const searchTerm = eventSearchInput.value.toLowerCase();
 const reasonFilter = document.getElementById("eventReasonFilter").value.toLowerCase();

 let filtered = flattenedEvents.filter((ev) => {
 if (namespaceFilter && ev.namespace.toLowerCase() !== namespaceFilter) {
 return false;
 }
 if (reasonFilter && ev.reason.toLowerCase() !== reasonFilter) {
 return false;
 }
 if (searchTerm) {
 let regex;
 try {
 regex = new RegExp(searchTerm,"i");
 } catch (e) {
 return false;
 }

 const combined = [ev.namespace, ev.name, ev.type, ev.reason, ev.object, ev.message]
 .map((x) => x?.toString())
 .join("");
 return regex.test(combined);
 }

 return true;
 });

 filtered.sort((a, b) => {
 let valA = a[currentSort.key] ||"";
 let valB = b[currentSort.key] ||"";

 if (currentSort.key ==="lastSeen") {
 valA = a.raw?.metadata?.creationTimestamp ? new Date(a.raw.metadata.creationTimestamp) : new Date(0);
 valB = b.raw?.metadata?.creationTimestamp ? new Date(b.raw.metadata.creationTimestamp) : new Date(0);
 return (valB - valA) * currentSort.direction;
 }

 if (valA < valB) return -1 * currentSort.direction;
 if (valA > valB) return 1 * currentSort.direction;
 return 0;
 });

 renderEventTable(filtered);
 updateReasonChart(filtered);
 }

 function renderEventTable(events) {
 const tbody = document.getElementById("eventTableBody");
 tbody.innerHTML ="";

 if (events.length === 0) {
 tbody.innerHTML = `
 <tr>
 <td colspan="6" class="text-center">No matching events found</td>
 </tr>`;
 document.getElementById("filteredEventCount").textContent ="No events found.";
 updateEventPagination(0);
 return;
 }

 const totalCount = events.length;
 const start = eventPageSize === -1 ? 0 : (eventCurrentPage - 1) * eventPageSize;
 const end = eventPageSize === -1 ? totalCount : Math.min(start + eventPageSize, totalCount);
 const paginatedEvents = eventPageSize === -1 ? events : events.slice(start, end);

 const countText = eventPageSize === -1
 ? `Showing all ${totalCount} event${totalCount !== 1 ?"s" :""}`
 : `Showing ${start + 1}-${end} of ${totalCount} event${totalCount !== 1 ?"s" :""}`;
 document.getElementById("filteredEventCount").textContent = countText;

 paginatedEvents.forEach((ev) => {
 const row = document.createElement("tr");
 row.className = "border-b hover:bg-gray-50 dark:hover:bg-gray-800";

 if (!ev.isPlaceholder) {
 row.classList.add("cursor-pointer");
 row.addEventListener("click", () => {
 lastClickedRow = row;
 showEventDetails(ev);
 });
 }
 row.innerHTML = `
 <td>${ev.namespace}</td>
 <td>${ev.lastSeen}</td>
 <td>${ev.type}</td>
 <td>${ev.reason}</td>
 <td>${ev.object}</td>
 <td class="whitespace-normal wrap-break-word max-w-lg">${ev.message}</td>
 `;

 tbody.appendChild(row);
 });

 updateEventPagination(totalCount);
 }

 function updateEventPagination(totalCount) {
   // the shared pager (diagPager): one page -> nothing drawn
   window.diagPager.render(document.getElementById('eventPaginationControls'), { total: totalCount, page: eventCurrentPage, pageSize: eventPageSize, go: function (p) { window.goToEventPage(p); } });
 }

 window.goToEventPage = function(page) {
 eventCurrentPage = page;
 sortAndFilterEvents();
 }

 window.changeEventPageSize = function() {
 const select = document.getElementById("eventPageSizeSelect");
 eventPageSize = parseInt(select.value);
 eventCurrentPage = 1;
 sortAndFilterEvents();
 }

 var reasonChart = null;

 function updateReasonChart(events) {
 const reasonCounts = {};

 events.forEach(ev => {
 if (ev.reason) {
 reasonCounts[ev.reason] = (reasonCounts[ev.reason] || 0) + 1;
 }
 });

 // one horizontal bar per reason, most frequent first (the shared category bars size the box by the row count);
 // a Warning reason reads in the warn colour; a click filters the table to that reason
 const warnReasons = new Set(events.filter((ev) => ev.type === 'Warning' && ev.reason).map((ev) => ev.reason));
 const rows = Object.entries(reasonCounts).sort((x, y) => y[1] - x[1]).slice(0, 40).map(([reason, count]) => ({ name: reason, count, role: warnReasons.has(reason) ? 'warn' : 'ok', title: reason }));
 const reasonSelect = document.getElementById('eventReasonFilter');
 reasonChart = window.diagChart.categoryBars('reasonChart', rows, {
 label: 'events',
 tooltip: (r) => [r.count + ' event' + (r.count !== 1 ? 's' : '') + (warnReasons.has(r.name) ? ', Warning' : '')],
 onRow: (r) => { if (!reasonSelect) return; reasonSelect.value = r.name; reasonSelect.dispatchEvent(new Event('change', { bubbles: true })); },
 });
 }

 function showEventDetails(ev) {
 currentEvent = ev;
 eventJsonViewer.innerHTML = renderJSONWithoutHighlight(ev.raw);
 eventPanel.style.setProperty('display', 'none', 'important');
 document.getElementById("eventDetailsPanel").style.setProperty('display', 'grid', 'important');

 // Scroll to top - find the scrollable parent by walking up the DOM
 setTimeout(() => {
 function findScrollableParent(element) {
 let parent = element.parentElement;
 while (parent) {
 const overflow = window.getComputedStyle(parent).overflow;
 const overflowY = window.getComputedStyle(parent).overflowY;
 if ((overflow === 'auto' || overflow === 'scroll' || overflowY === 'auto' || overflowY === 'scroll') &&
 parent.scrollHeight > parent.clientHeight) {
 return parent;
 }
 parent = parent.parentElement;
 }
 return null;
 }

 const detailsPanel = document.getElementById("eventDetailsPanel");
 const scrollableParent = findScrollableParent(detailsPanel);
 if (scrollableParent) {
 scrollableParent.scrollTo({top: 0, behavior: 'instant'});
 }
 }, 0);

 eventDetailsTable.innerHTML = `
 <tr><td>Namespace:</td><td>${ev.namespace}</td></tr>
 <tr><td>Name:</td><td>${ev.name}</td></tr>
 <tr><td>Last Seen:</td><td>${ev.lastSeen}</td></tr>
 <tr><td>Type:</td><td>${ev.type}</td></tr>
 <tr><td>Reason:</td><td>${ev.reason}</td></tr>
 <tr><td>Object:</td><td>${ev.object}</td></tr>
 <tr><td>Message:</td><td>${ev.message}</td></tr>
 `;

 // Setup YAML filter
 const yamlFilterInput = document.getElementById('eventYamlFilter');
 if (yamlFilterInput) {
 yamlFilterInput.value = '';
 yamlFilterInput.removeEventListener('input', filterEventYaml);
 yamlFilterInput.addEventListener('input', filterEventYaml);
 }
 }

 window.backFromEventModal = function() {
 document.getElementById("eventDetailsPanel").style.setProperty('display', 'none', 'important');
 eventPanel.style.setProperty('display', 'grid', 'important');
 currentEvent = null;
 eventJsonViewer.innerHTML ="";

 const yamlFilterInput = document.getElementById('eventYamlFilter');
 if (yamlFilterInput) {
 yamlFilterInput.value = '';
 }

 // Scroll back to the last clicked row
 if (lastClickedRow) {
 setTimeout(() => {
 lastClickedRow.scrollIntoView({ behavior: 'instant', block: 'center' });
 }, 0);
 }
 }


 function highlightJSON(line) {
 line = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
 return line
 .replace(/"([^"]+)":/g, '<span class="text-blue-700 dark:text-blue-300">"$1"</span>:')
 .replace(/:\s*"([^"]*)"/g, ': <span class="text-green-700 dark:text-green-300">"$1"</span>')
 .replace(/:\s*(true|false)/g, ': <span class="text-blue-600 dark:text-blue-400">$1</span>')
 .replace(/:\s*(null)/g, ': <span class="text-gray-500 dark:text-gray-400">$1</span>')
 .replace(/:\s*(-?\d+\.?\d*)/g, ': <span class="text-orange-600 dark:text-orange-400">$1</span>');
 }

 function renderJSONWithoutHighlight(data, filter = '') {
 const formatted = JSON.stringify(data, null, 2);
 return formatted.split('\n')
 .filter(line => !filter || line.toLowerCase().includes(filter.toLowerCase()))
 .map(line => {
 const highlighted = highlightJSON(line);
 return `<div class="text-gray-900 dark:text-gray-100 text-sm font-mono whitespace-pre-wrap break-all">${highlighted}</div>`;
 }).join('');
 }

 function filterEventYaml() {
 if (!currentEvent) return;
 const filterInput = document.getElementById('eventYamlFilter');
 const filterValue = filterInput ? filterInput.value : '';
 eventJsonViewer.innerHTML = renderJSONWithoutHighlight(currentEvent.raw, filterValue);
 }

 eventNamespaceFilter.addEventListener("change", () => {
 eventCurrentPage = 1;
 sortAndFilterEvents();
 });

 document.getElementById("eventReasonFilter").addEventListener("change", () => {
 eventCurrentPage = 1;
 sortAndFilterEvents();
 });

 eventSearchInput.addEventListener("input", () => {
 eventCurrentPage = 1;
 sortAndFilterEvents();
 });

 showEmptyNamespacesCheckbox.addEventListener("change", () => {
 eventCurrentPage = 1;
 flattenEvents(showEmptyNamespacesCheckbox.checked);
 });

 updateSortIndicators();
 flattenEvents(showEmptyNamespacesCheckbox.checked);

 // Watch for theme changes and re-render chart
 const themeObserver = new MutationObserver((mutations) => {
 mutations.forEach((mutation) => {
 if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
 // Theme has changed, update chart
 sortAndFilterEvents();
 }
 });
 });

 // Start observing theme changes
 themeObserver.observe(document.documentElement, {
 attributes: true,
 attributeFilter: ['class']
 });
</script>
