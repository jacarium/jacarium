{% import "tabs/_ui.html" as ui %}
{{ ui.findings(findings) }}
<div id="cpu-root" class="grid grid-cols-1 gap-6">
 {% if data %}
<div class="panel rounded-lg shadow-sm">
  {% call ui.toolbar() %}
    <label class="ui-rows">Day<span class="ui-select-wrap ui-narrow"><select id="mem-day-filter" class="ui-select" aria-label="Day"><option value="ALL">All</option></select>{{ ui.icon('chevron') }}</span></label>
    <span class="ui-chips" id="mem-metric-toggle" aria-label="Metrics"></span>
  {% endcall %}
 <div id="mem-chart-area"></div>
 {% else %}
 {% endif %}
 </div>
</div>

<script>
 (function () {
 const memData = {{ data | tojson }};
 let showLegend = true;
 const memChartArea = document.getElementById('mem-chart-area');
 // When the report has no memory data, the empty-data branch renders the "No Data Available"
 // placeholder instead of #mem-chart-area (no card element). Bail before any render so
 // the script doesn't crash on null.innerHTML. (The old parent-document
 // renderer wrapped these scripts in a try/catch that silently swallowed this;
 // the sandboxed srcdoc executes them natively, surfacing it as an uncaught
 // TypeError - so guard explicitly.)
 if (!memChartArea) return;
 const memDayFilter = document.getElementById('mem-day-filter');
 const memMetricToggle = document.getElementById('mem-metric-toggle');

 const memMetricKeys = ['kbmemfree', 'kbavail', 'kbmemused', '%memused', 'kbbuffers', 'kbcached', 'kbcommit', '%commit', 'kbactive', 'kbinact', 'kbdirty', 'kbanonpg', 'kbslab', 'kbkstack', 'kbpgtbl', 'kbvmused'];
 const colorMap = {
 'kbmemfree': 'rgba(144,238,144,0.8)',
 'kbavail': 'rgba(173,216,230,0.8)',
 'kbmemused': 'rgba(255,182,193,0.8)',
 '%memused': 'rgba(255,215,0,0.8)',
 'kbbuffers': 'rgba(255,99,132,0.8)',
 'kbcached': 'rgba(0,206,209,0.8)',
 'kbcommit': 'rgba(147,112,219,0.8)',
 '%commit': 'rgba(255,140,0,0.8)',
 'kbactive': 'rgba(70,130,180,0.8)',
 'kbinact': 'rgba(218,165,32,0.8)',
 'kbdirty': 'rgba(0,255,127,0.8)',
 'kbanonpg': 'rgba(176,196,222,0.8)',
 'kbslab': 'rgba(255,105,180,0.8)',
 'kbkstack': 'rgba(240,230,140,0.8)',
 'kbpgtbl': 'rgba(205,92,92,0.8)',
 'kbvmused': 'rgba(119,136,153,0.8)'
 };

 let enabledMemMetrics = new Set(memMetricKeys);

 function createMetricToggles() {
 memMetricToggle.innerHTML = '';

 const toggleAllLabel = document.createElement('label');
 toggleAllLabel.className = 'ui-chip';

 const toggleAllCheckbox = document.createElement('input');
 toggleAllCheckbox.type = 'checkbox';
 toggleAllCheckbox.id = 'toggle-all-mem-metrics';
 toggleAllCheckbox.checked = true;
 toggleAllCheckbox.className = 'ui-check';

 toggleAllLabel.appendChild(toggleAllCheckbox);
 toggleAllLabel.append('All');
 memMetricToggle.appendChild(toggleAllLabel);


 const legendLabel = document.createElement('label');
 legendLabel.className = 'ui-chip';
 const legendCheckbox = document.createElement('input');
 legendCheckbox.type = 'checkbox';
 legendCheckbox.id = 'legend-toggle';
 legendCheckbox.checked = true;
 legendCheckbox.className = 'ui-check';

 legendLabel.appendChild(legendCheckbox);
 legendLabel.append('Show Legend');
 memMetricToggle.appendChild(legendLabel);

 showLegend = true;
 legendCheckbox.addEventListener('change', () => {
 showLegend = legendCheckbox.checked;
 renderMemoryGraph();
 });

 enabledMemMetrics = new Set();
 const checkboxes = [];

 memMetricKeys.forEach((metric, idx) => {
 const checkboxId = `mem-metric-${idx}`;

 const label = document.createElement('label');
 label.className = 'ui-chip';
 label.setAttribute('for', checkboxId);

 const checkbox = document.createElement('input');
 checkbox.type = 'checkbox';
 checkbox.id = checkboxId;
 checkbox.value = metric;
 checkbox.checked = true;
 checkbox.className = 'ui-check';

 enabledMemMetrics.add(metric);
 checkboxes.push(checkbox);

 checkbox.addEventListener('change', () => {
 if (checkbox.checked) {
 enabledMemMetrics.add(metric);
 } else {
 enabledMemMetrics.delete(metric);
 }
 toggleAllCheckbox.checked = checkboxes.every(cb => cb.checked);
 renderMemoryGraph();
 });

 label.appendChild(checkbox);
 label.append(metric);
 memMetricToggle.appendChild(label);
 });

 toggleAllCheckbox.addEventListener('change', () => {
 const enableAll = toggleAllCheckbox.checked;
 checkboxes.forEach(cb => {
 cb.checked = enableAll;
 if (enableAll) {
 enabledMemMetrics.add(cb.value);
 } else {
 enabledMemMetrics.delete(cb.value);
 }
 });
 renderMemoryGraph();
 });
 }


 function createChartCard(datasets, labels) {
 const card = document.createElement('div');
 card.className = 'panel rounded-lg p-4 shadow-sm';
 const canvas = document.createElement('canvas');
 canvas.style.width = '100%';
 canvas.style.height = '260px';
 card.appendChild(canvas);

 window.diagChart.make(canvas.getContext('2d'), {
 type: 'line',
 data: { labels, datasets },
 options: {
 responsive: true,
 animation: false,
 plugins: {
 legend: {
 display: showLegend,
 labels: { color: diagnosticsThemeColor('text'), font: { size: 12 } }
 },
 tooltip: {
 backgroundColor: diagnosticsThemeColor('tooltip'),
 titleColor: '#facc15',
 bodyColor: diagnosticsThemeColor('text')
 }
 },
 scales: {
 x: {
 grid: { color: diagnosticsThemeColor('grid') },
 ticks: { color: diagnosticsThemeColor('text'), font: { size: 11 } }
 },
 y: {
 beginAtZero: true,
 grid: { color: diagnosticsThemeColor('grid') },
 ticks: { color: diagnosticsThemeColor('text'), font: { size: 11 } }
 }
 }
 }
 });

 return card;
 }

 function renderMemoryGraph() {
 const selectedDay = memDayFilter.value;
 const combined = {};

 if (selectedDay === 'ALL') {
 Object.entries(memData).forEach(([day, entries]) => {
 day_label = day.replace(/_/g, ' ').replace(/\d{4}/, '').trim();
 day_label = day_label.charAt(0).toUpperCase() + day_label.slice(1);
 entries.forEach(entry => {
 const key = `${day_label} ${entry.time}`;
 combined[key] = entry;
 });
 });
 } else {
 (memData[selectedDay] || []).forEach(entry => {
 combined[entry.time] = entry;
 });
 }

 const sortedKeys = Object.keys(combined).sort();
 const labels = sortedKeys;
 const datasets = Array.from(enabledMemMetrics).map(metric => ({
 label: metric,
 data: sortedKeys.map(k => combined[k]?.[metric]),
 borderColor: colorMap[metric],
 backgroundColor: colorMap[metric].replace('0.8', '0.1'),
 fill: true,
 tension: 0.2
 }));

 memChartArea.innerHTML = '';
 memChartArea.appendChild(createChartCard(datasets, labels));
 }

 function initDayDropdown() {
 Object.keys(memData).forEach(day => {
 const option = document.createElement('option');
 option.value = day;
 option.textContent = day.replace(/_/g, ' ').replace(/\d{4}/, '').trim();
 option.textContent = option.textContent.charAt(0).toUpperCase() + option.textContent.slice(1);
 memDayFilter.appendChild(option);
 });

 memDayFilter.addEventListener('change', renderMemoryGraph);
 memDayFilter.value = 'ALL';
 }

 createMetricToggles();
 initDayDropdown();
 renderMemoryGraph();

 // Watch for theme changes and re-render charts
 const themeObserver = new MutationObserver((mutations) => {
 mutations.forEach((mutation) => {
 if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
 // Theme has changed, re-render chart
 renderMemoryGraph();
 }
 });
 });

 // Start observing theme changes
 themeObserver.observe(document.documentElement, {
 attributes: true,
 attributeFilter: ['class']
 });
 })();
</script>
