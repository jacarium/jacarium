# Build Jacarium's desktop installers and its self-hosted container image on
# GitHub's own runners when a version tag (v1.2.3) is pushed: the installers
# become a DRAFT release (review it on GitHub, then click "Publish release"),
# the image goes to quay.io/zerodayz/jacarium once a reviewer approves the
# "quay" environment.
#
# Only official GitHub actions (github.com/actions/*), each pinned to the
# full commit of its release (the comment names the version). The release
# itself is made with the gh CLI that GitHub preinstalls on its runners; the
# image with the podman it preinstalls.
#
# Jobs:
#   build          the desktop installers, one job per platform
#   release        the draft release (tags only)
#   image          the container image, one native build per architecture
#                  (amd64, arm64; no QEMU), saved as a workflow artifact.
#                  No secrets and no registry here: the build runs the
#                  dependencies' install scripts.
#   image-publish  tags only, environment "quay" (a required reviewer
#                  approves it, once): loads both images, signs in to
#                  quay.io keylessly (GitHub's OIDC token exchanged for a
#                  one-hour robot token - no stored secret), pushes
#                  :<version>-amd64, :<version>-arm64, the manifest list as
#                  :<version> and :latest, signs out, and attests the list's
#                  digest. The image jobs do not depend on the desktop jobs.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:        # a manual test run: builds everything, publishes nothing

# Read-only by default; a job that needs more says so
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   runner: ubuntu-24.04,     platform: linux, format: 'AppImage deb rpm' }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, platform: linux, format: 'AppImage deb rpm' }
          - { name: macos-arm64, runner: macos-26,         platform: mac,   format: dmg }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (the version in .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python 3.14 (requirements.lock is resolved for it)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Linux packaging tools (rpmbuild, from Ubuntu's own archive)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $want"
            exit 1
          fi

      - name: Build
        env:
          # no Apple signing identity yet: build unsigned instead of searching for one
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ./rebuild.sh --no-container --platform "${{ matrix.platform }}" --format "${{ matrix.format }}"

      - name: Keep the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacarium-${{ matrix.name }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # create the release and upload its files
      id-token: write        # sign the build provenance
      attestations: write    # store it
    steps:
      - name: Check out (for CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jacarium-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build provenance (gh attestation verify <file> --repo jacarium/jacarium)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## What's New in v${version}" \
            '$0 == h { on = 1; next } on && /^## What.s New in v/ { exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "Jacarium ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md

  # ---------------------------------------------------------------------------
  # The self-hosted container image (deploy/Containerfile): built natively on
  # each architecture and kept as an artifact. This job has no secrets, no
  # environment and no registry access on purpose - `npm ci` and `pip install`
  # run the dependencies' own scripts here.
  # ---------------------------------------------------------------------------
  image:
    name: Container image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $want"
            exit 1
          fi

      - name: Podman (preinstalled on GitHub's Ubuntu images; Ubuntu's own archive otherwise)
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends podman
          fi
          podman --version

      # --format docker: the OCI image format has no HEALTHCHECK, so podman
      # would drop the Containerfile's (deploy/deploy-podman.sh builds the
      # same way). A native build: the runner's own architecture, no QEMU -
      # checked against the image afterwards, since a base image pinned to a
      # single-architecture digest would silently build the wrong one.
      - name: Build
        run: |
          version="$(jq -r .version package.json)"
          image="localhost/jacarium:${version}-${ARCH}"
          podman build --format docker -f deploy/Containerfile -t "$image" .
          got="$(podman image inspect --format '{{.Architecture}}' "$image")"
          if [ "$got" != "$ARCH" ]; then
            echo "::error::built a $got image on the $ARCH runner"
            exit 1
          fi
          # docker-archive keeps the docker image format, HEALTHCHECK included
          podman save --format docker-archive -o "jacarium-${ARCH}.tar" "$image"
          ls -la "jacarium-${ARCH}.tar"

      - name: Keep the image for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: jacarium-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Publish to Quay: tags only, and only after a reviewer approves the "quay"
  # environment (one approval for both architectures). This runner never
  # builds anything - it loads the two archives and pushes them - and no
  # secret is stored anywhere: the robot account is federated with this
  # workflow's OIDC identity (subject repo:jacarium/jacarium:environment:quay),
  # and Quay hands out a robot token that expires after an hour.
  # ---------------------------------------------------------------------------
  image-publish:
    name: Publish the image to Quay
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: quay
    permissions:
      contents: read
      id-token: write        # the OIDC token Quay exchanges for a robot token, and the provenance signature
      attestations: write    # store the provenance
    env:
      IMAGE: quay.io/zerodayz/jacarium
      QUAY_ROBOT: zerodayz+github_release     # the federated robot account (see the Quay setup notes)
    steps:
      - name: Collect the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
          merge-multiple: true

      - name: Podman (preinstalled on GitHub's Ubuntu images; Ubuntu's own archive otherwise)
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends podman
          fi
          podman --version

      - name: Load the images and check their version and architecture
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            podman load -i "images/jacarium-${arch}.tar"
            image="localhost/jacarium:${version}-${arch}"
            podman image exists "$image" || { echo "::error::images/jacarium-${arch}.tar did not contain $image"; exit 1; }
            got="$(podman image inspect --format '{{.Architecture}}' "$image")"
            [ "$got" = "$arch" ] || { echo "::error::$image is a $got image"; exit 1; }
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Keyless: GitHub mints an OIDC token for this job; Quay's federated
      # robot token endpoint exchanges it (HTTP basic auth, robot name as the
      # user, the OIDC token as the password) for a robot token valid for one
      # hour. Both tokens travel on stdin / in a curl config, never on a
      # command line, and the robot token is masked in the log.
      - name: Sign in to quay.io (keyless; a stored robot token only as a fallback)
        env:
          # Fallback only: if the quay environment has these secrets and the
          # keyless exchange fails, they are used (with a warning). Without
          # them a failed exchange fails the job.
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          token=""
          jwt="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                 "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" | jq -r .value)"
          if [ -n "$jwt" ] && [ "$jwt" != null ]; then
            # what GitHub presents (not secret): Quay's federation must match iss, sub and aud
            payload="$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')"
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
            echo "OIDC token: $(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -c '{iss, sub, aud}' 2>/dev/null || echo '(could not decode)')"
            # no -f: on an error Quay's response body says why (it holds no secret)
            response="$(printf 'user = "%s:%s"\n' "$QUAY_ROBOT" "$jwt" \
                        | curl -sS -w '\n%{http_code}' -K - https://quay.io/oauth2/federation/robot/token)" || true
            status="${response##*$'\n'}"; body="${response%$'\n'*}"
            token="$(printf '%s' "$body" | jq -r '.token // empty' 2>/dev/null || true)"
            if [ "$status" != 200 ] || [ -z "$token" ]; then
              token=""
              echo "::warning::quay.io did not exchange the OIDC token (HTTP $status) - its answer follows; compare the robot federation (issuer, subject, audience) with the OIDC token above"
              printf '%s' "$body" | jq -c 'del(.token)' 2>/dev/null || printf '%s\n' "$body" | head -c 500
            fi
          else
            echo "::warning::no OIDC token (is id-token: write set?)"
          fi
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            printf '%s' "$token" | podman login quay.io -u "$QUAY_ROBOT" --password-stdin
            echo "signed in keylessly"
          elif [ -n "$QUAY_USERNAME" ] && [ -n "$QUAY_TOKEN" ]; then
            echo "::warning::falling back to the stored robot token (QUAY_USERNAME / QUAY_TOKEN) - remove those secrets once keyless sign-in works"
            printf '%s' "$QUAY_TOKEN" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin
          else
            echo "::error::keyless sign-in failed and the quay environment has no QUAY_USERNAME / QUAY_TOKEN fallback"
            exit 1
          fi

      # --format v2s2 everywhere: the docker manifest format carries the
      # HEALTHCHECK; a list pushed as OCI would convert the images and drop it.
      - name: Push the images and the manifest list (:<version>-<arch>, :<version>, :latest)
        id: push
        run: |
          for arch in amd64 arm64; do
            podman push --format v2s2 "localhost/jacarium:${VERSION}-${arch}" "docker://${IMAGE}:${VERSION}-${arch}"
          done
          podman manifest create "localhost/jacarium:${VERSION}"
          for arch in amd64 arm64; do
            podman manifest add "localhost/jacarium:${VERSION}" "containers-storage:localhost/jacarium:${VERSION}-${arch}"
          done
          podman manifest push --all --format v2s2 --digestfile list.digest "localhost/jacarium:${VERSION}" "docker://${IMAGE}:${VERSION}"
          podman manifest push --all --format v2s2 --digestfile latest.digest "localhost/jacarium:${VERSION}" "docker://${IMAGE}:latest"
          digest="$(cat list.digest)"
          [ "$digest" = "$(cat latest.digest)" ] || { echo "::error::the :${VERSION} and :latest lists differ"; exit 1; }
          echo "${IMAGE}:${VERSION} = ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign out of quay.io
        if: always()
        run: podman logout quay.io || true

      # Stored with GitHub (not pushed to Quay: the referrers support of
      # quay.io is unconfirmed and this runner is signed out by now).
      #   gh attestation verify oci://quay.io/zerodayz/jacarium:<version> --repo jacarium/jacarium
      - name: Build provenance of the manifest list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: quay.io/zerodayz/jacarium
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
