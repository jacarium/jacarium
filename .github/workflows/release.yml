# Build Jacarium's desktop installers and its self-hosted container image on
# GitHub's own runners when a version tag (v1.2.3) is pushed: the installers,
# their SBOMs and checksums become a DRAFT release (review it on GitHub, then
# click "Publish release"), the image goes to quay.io/zerodayz/jacarium once a
# reviewer approves the "quay" environment.
#
# The build itself lives in the reusable workflow build.yml - that is what
# makes the provenance SLSA Build L3 (see the notes there): this file only
# calls it and, once everything is signed, verifies the fresh attestations
# with the GitHub CLI before the draft release is created. A release whose
# attestations do not verify is not created.
#
# Only official GitHub actions (github.com/actions/*), each pinned to the
# full commit of its release (the comment names the version). The release
# itself is made with the gh CLI that GitHub preinstalls on its runners.
#
# Jobs:
#   build     build.yml: installers, image, attest, publish (tags only)
#   release   tags only: downloads the installers and SBOMs, verifies every
#             file's provenance and SBOM attestation and the pushed image's
#             provenance, then creates the draft release
name: Release
# each run titled by its tag in the Actions list ("Release v3.4.5")
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:        # a manual test run: builds and attests everything, publishes nothing

# Nothing by default; every job says what it needs
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    # the reusable workflow's jobs ask for these themselves; a caller must
    # grant what the callee uses, and nothing more
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/') }}

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # create the release and upload its files
    env:
      IMAGE: quay.io/zerodayz/jacarium
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out (for CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the installers, the SBOMs and the VEX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{jacarium,sbom,sbom-image,vex}-*'
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Every file to be published, and the image that was pushed, verified
      # the way a user would verify them - against the attestations build.yml
      # just stored. --signer-workflow pins the reusable workflow (the L3
      # builder identity), --deny-self-hosted-runners the runner class.
      - name: Verify the attestations before anything is published
        env:
          SIGNER: ${{ github.repository }}/.github/workflows/build.yml
          DIGEST: ${{ needs.build.outputs.image-digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -e
          for f in release/*; do
            case "$f" in release/SHA256SUMS.txt) continue ;; esac
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --deny-self-hosted-runners > /dev/null
            echo "provenance ok: $f"
          done
          for f in release/*.AppImage release/*.deb release/*.rpm release/*.dmg; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3 > /dev/null
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --deny-self-hosted-runners \
              --predicate-type https://openvex.dev/ns/v0.2.0 > /dev/null
            echo "SBOM and VEX attestations ok: $f"
          done
          [ -n "$DIGEST" ] || { echo "::error::build.yml published no image digest"; exit 1; }
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --deny-self-hosted-runners > /dev/null
          echo "image provenance ok: ${IMAGE}@${DIGEST} (:${VERSION})"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --deny-self-hosted-runners \
            --predicate-type https://spdx.dev/Document/v2.3 > /dev/null || echo "::warning::no SBOM attestation on the manifest list itself (the per-architecture images carry them)"

      - name: Release notes from CHANGELOG.md
        env:
          DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## What's New in v${version}" \
            '$0 == h { on = 1; next } on && /^## What.s New in v/ { exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "## Verify this release"
            echo
            echo 'Every file below and the container image carry signed build provenance (SLSA Build L3, GitHub artifact attestations) and an SBOM attestation; the image is also signed with cosign. With the GitHub CLI and cosign:'
            echo
            echo '```bash'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/build.yml --deny-self-hosted-runners"
            echo "gh attestation verify <installer> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/build.yml --predicate-type https://spdx.dev/Document/v2.3"
            echo "gh attestation verify oci://quay.io/zerodayz/jacarium:${version} --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/build.yml --deny-self-hosted-runners"
            echo "cosign verify quay.io/zerodayz/jacarium:${version} --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/tags/v${version} --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Image digest: \`${DIGEST}\`. The SBOMs (SPDX and CycloneDX JSON) are attached: one per installer platform, made from the unpacked application (an .AppImage, .deb and .rpm of one platform share it), and one per image architecture - the image's full SPDX lists every file and is too large to attest (16 MiB limit), so the attested SBOM of each image is its package-level copy, \`...image-<arch>.packages.spdx.json\` (every package, licence, PURL and package relationship; no file entries), attached as well; \`jacarium-${version}.openvex.json\` is the VEX statement for this release (the scanner findings that do not affect Jacarium, with the reasons, and the ones with a fix pending), attested with \`--predicate-type https://openvex.dev/ns/v0.2.0\` and attached to the image as a cosign attestation (\`cosign verify-attestation --type openvex\`). SECURITY.md describes the supply chain."
          } >> notes.md
          cat notes.md

      - name: Create the draft release
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "Jacarium ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
